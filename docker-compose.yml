x-api: &api
  image: ghcr.io/williancesar/rinha-fraud-api:v8-20260505-073155-ea01fab
  volumes:
    - sock:/run/sock
  networks: [rinha]
  deploy:
    resources:
      limits:
        cpus: "0.29"
        memory: "150M"

services:
  api-1:
    <<: *api
    environment:
      SOCKET_PATH: /run/sock/api1.sock
    cpuset: "0,1"

  api-2:
    <<: *api
    environment:
      SOCKET_PATH: /run/sock/api2.sock
    cpuset: "2,3"

  lb:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - sock:/run/sock
    ports:
      - "9999:9999"
    cpuset: "0,2"
    deploy:
      resources:
        limits:
          cpus: "0.42"
          memory: "50M"
    depends_on:
      - api-1
      - api-2
    networks: [rinha]

volumes:
  sock:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=4m,mode=0777"

networks:
  rinha:
    driver: bridge
